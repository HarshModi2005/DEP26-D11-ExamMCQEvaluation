# Fly.io config — deploy from repo root:  fly launch  (first time)  then  fly deploy
# Docs: https://fly.io/docs/reference/configuration/
#
# First-time setup (summary):
#   1. fly auth login
#   2. fly launch --no-deploy --name <your-app-name>   # or set `app` below after `fly apps create`
#   3. fly secrets set SUPABASE_DB_URL="postgresql://..." CACHE_BACKEND=supabase
#   4. fly secrets set GOOGLE_CREDENTIALS_BASE64="<output of: base64 -i key.json | tr -d '\n'>"
#   5. fly deploy
#
# Optional persistent disk for local SQLite (evaluation.db) — not used by Supabase cache:
#   fly volumes create eval_data --region <same-as-primary_region> --size 1
#   Then add [[mounts]] below and point DB path in app (env) — today DB defaults to cwd.
#
# Replace this with your real app name from the Fly dashboard:
app = "answerkey-eval-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

  # Long batch OCR / eval — avoid proxy closing idle connections too aggressively
  [http_service.http_options]
    idle_timeout = 600

[[http_service.checks]]
  grace_period = "30s"
  interval = "45s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"
  cpus = 1
  cpu_kind = "shared"
  processes = ["app"]
